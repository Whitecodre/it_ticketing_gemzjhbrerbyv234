<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #F8FAFC;
            color: #0F172A;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #0F172A; color: #F8FAFC; }
            .card { border-color: #334155 !important; }
            .muted { color: #94A3B8 !important; }
            .btn { background: #2DD4BF !important; color: #0F172A !important; }
        }
        .card { max-width: 26rem; text-align: center; padding: 1rem; }
        h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem; }
        p.muted { color: #475569; margin: 0 0 1.5rem; }
        .btn {
            display: inline-block;
            background: #0D9488;
            color: #fff;
            text-decoration: none;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Something went wrong on our end</h1>
        <p class="muted">The error has been logged. Please try again in a moment, and contact your IT support team if it keeps happening.</p>
        <a class="btn" href="/">Back to dashboard</a>
    </div>
</body>
</html>
