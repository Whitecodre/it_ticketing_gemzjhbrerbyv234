{% load lucide %}

{% if items %}
<ul class="text-sm space-y-1">
    {% for item in items %}
    <li class="flex items-center justify-between text-text-primary">
        <span>{{ item.asset.name }} <span class="text-text-secondary font-mono text-xs">({{ item.asset.tracking_id }})</span></span>
        <span class="text-xs text-text-secondary">since {{ item.mobilization.mobilized_at|date:"M j" }}</span>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="text-sm text-text-secondary">Nothing currently mobilized for this job/vessel/dive system.</p>
{% endif %}
