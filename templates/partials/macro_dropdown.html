{% load lucide %}

<div class="max-h-72 overflow-y-auto divide-y divide-border">
    {% for macro in macros %}
    <button type="button"
            class="w-full text-left px-3 py-2.5 hover:bg-black/5 transition flex flex-col gap-0.5"
            onclick="insertMacro('{{ macro.body|escapejs }}', '{{ macro.visibility }}')">
        <span class="flex items-center justify-between gap-2">
            <span class="text-xs font-semibold text-text-primary truncate">{{ macro.title }}</span>
            <span class="text-[0.55rem] px-1.5 py-0.5 rounded-full border border-border text-text-secondary shrink-0">
                {{ macro.get_type_display }}
            </span>
        </span>
        <span class="text-[0.65rem] text-text-secondary truncate">{{ macro.body|truncatechars:60 }}</span>
    </button>
    {% empty %}
    <div class="flex flex-col items-center justify-center py-8 px-4 text-center">
        {% lucide "zap-off" size=20 class="text-text-secondary mb-2" %}
        <p class="text-xs text-text-secondary">No macros yet.</p>
    </div>
    {% endfor %}
</div>
