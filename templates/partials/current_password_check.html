{% if valid %}
    <div id="currentPasswordStatusInner" data-valid="true" class="text-success text-xs mt-1 flex items-center gap-1">
        {% lucide "check-circle" size=14 class="text-success" %}
        Verified
    </div>
{% else %}
    <div id="currentPasswordStatusInner" data-valid="false" class="text-error text-xs mt-1 flex items-center gap-1">
        {% if message %}
            {% lucide "x-circle" size=14 class="text-error" %}
            {{ message }}
        {% endif %}
    </div>
{% endif %}
