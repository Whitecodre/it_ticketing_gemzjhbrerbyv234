{% load lucide %}

<div class="p-6">
    <div class="flex items-center gap-3 mb-4">
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-success/10 text-success shrink-0">
            {% lucide "check-circle" size=20 %}
        </div>
        <div>
            <h3 class="text-base font-semibold text-text-primary">Scrap Approval</h3>
            <p class="text-sm text-text-secondary">Approve or reject the scrap request for this asset.</p>
        </div>
    </div>

    <form method="post" action="{% url 'tickets:asset_scrap_approve' asset.id %}">
        {% csrf_token %}
        <input type="hidden" name="action" value="approve">
        
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1 text-text-primary">
                Comment (optional)
            </label>
            <textarea name="comment" rows="3" 
                      class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary"
                      placeholder="Add any notes about this scrap approval..."></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" 
                    class="btn-ghost text-sm px-4 py-2 rounded-lg">Cancel</button>
            <button type="submit" 
                    class="btn-success text-sm px-4 py-2 rounded-lg flex items-center gap-1">
                {% lucide "check" size=14 %} Approve
            </button>
            <button type="submit" formaction="{% url 'tickets:asset_scrap_approve' asset.id %}?action=reject" 
                    class="btn-danger text-sm px-4 py-2 rounded-lg flex items-center gap-1">
                {% lucide "x" size=14 %} Reject
            </button>
        </div>
    </form>
</div>
