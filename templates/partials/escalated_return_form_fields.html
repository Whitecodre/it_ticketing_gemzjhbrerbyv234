{% load lucide %}
<div id="returnFormFields" class="space-y-4">
    {% if form.non_field_errors %}
    <p class="text-xs text-error">{{ form.non_field_errors.0 }}</p>
    {% endif %}
    <div>
        <label for="returnReason" class="block text-sm font-medium mb-1 text-text-primary">Reason (optional)</label>
        <select id="returnReason" onchange="fillComment('returnComment', this.value)" class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary">
            <option value="">Select a predefined reason…</option>
            {% for reason in return_reasons %}
            <option value="{{ reason.body }}">{{ reason.title }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label for="returnComment" class="block text-sm font-medium mb-1 text-text-primary">Comment <span class="text-error">*</span></label>
        {{ form.comment }}
        {% if form.comment.errors %}<p class="text-xs text-error mt-1">{{ form.comment.errors.0 }}</p>{% endif %}
    </div>
    <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeReturnModal()" class="btn-ghost text-sm">Cancel</button>
        <button type="button" onclick="confirmReturnToPool()" class="btn-danger text-sm px-4 py-2 rounded-lg flex items-center gap-1">
            {% lucide "corner-up-left" size=14 %} Return to Pool
        </button>
    </div>
</div>
