{% extends "base_registration.html" %}
{% load static %}
{% block title %}Email Not Verified{% endblock %}
{% block content %}
<div class="flex min-h-screen items-center justify-center px-4 py-12">
    <div class="w-full max-w-md text-center space-y-4">
        <!-- <img src="{% static 'img/gemz-logo.png' %}" alt="Gemz Software Logo" class="mx-auto h-10 w-auto"> -->
        <div class="flex justify-center">
            <div class="flex h-16 w-16 items-center justify-center rounded-full bg-error/10">
                {% lucide "x-circle" size=32 class="h-8 w-8 text-error" %}
            </div>
        </div>
        <h2 class="text-2xl font-bold text-error">Invalid Link</h2>
        <p class="text-text-secondary">The verification link is invalid or has expired. Please register again.</p>
        <a href="{% url 'accounts:register' %}" class="btn-login inline-block rounded-full px-6 py-3 text-white">Try Again</a>
    </div>
</div>
{% endblock %}
