{% load lucide %}

<div class="org-node" x-data="orgNode(node, path)">
    <div class="node-card" :style="{borderColor: node.color || '#64748B'}">
        <div class="node-actions">
            <button class="add-btn" @click="addChild()" title="Add Child">
                {% lucide "plus" size=12 %}
            </button>
            <button class="del-btn" @click="removeNode()" title="Remove">
                {% lucide "trash-2" size=12 %}
            </button>
        </div>
        <div class="avatar" :style="{backgroundColor: node.color || '#0D9488'}">
            <span x-text="node.label ? node.label.charAt(0).toUpperCase() : '?' "></span>
        </div>
        <div class="name" x-text="node.label || 'Untitled'"></div>
        <div class="title" x-text="node.position || 'Position'"></div>

        <div class="mt-1 space-y-1">
            <input type="text" x-model="node.label" @input="save()"
                   placeholder="Name"
                   class="w-full text-xs rounded border px-1 py-0.5 bg-background border-border text-text-primary">
            <input type="text" x-model="node.position" @input="save()"
                   placeholder="Title"
                   class="w-full text-xs rounded border px-1 py-0.5 bg-background border-border text-text-primary">
            <input type="color" x-model="node.color" @change="save()"
                   class="w-full h-5 rounded border border-border cursor-pointer">
        </div>
    </div>

    <template x-if="node.children && node.children.length">
        <div>
            <div class="node-connector"></div>
            <div class="org-children">
                <template x-for="(child, childIndex) in node.children" :key="child.id || childIndex">
                    {% include "organogram/partials/builder_node.html" with node=child path=path|slice:":"|add:childIndex %}
                </template>
            </div>
        </div>
    </template>
</div>
