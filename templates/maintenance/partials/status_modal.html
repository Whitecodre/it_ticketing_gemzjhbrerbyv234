{% load lucide %}

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50" 
     onclick="if(event.target === this) this.remove();">
    <div class="bg-surface rounded-xl shadow-2xl w-full max-w-md mx-4 p-6"
         onclick="event.stopPropagation()">

        <div class="flex items-center justify-between mb-2">
            <h3 class="text-lg font-semibold text-text-primary">
                Update Status
            </h3>
            <button type="button" onclick="this.closest('.fixed').remove()" class="btn-ghost p-1" aria-label="Close">
                {% lucide "x" size=18 %}
            </button>
        </div>
        <p class="text-sm mb-4 text-text-secondary">
            {{ schedule.title }}
        </p>
        
        <form method="post"
              hx-post="{% url 'maintenance:update_status' schedule.pk %}"
              hx-target="#statusModalContainer"
              hx-swap="outerHTML">
            
            {% csrf_token %}
            
            <div class="space-y-3">
                {% if can_set_execution_status %}
                <label class="block">
                    <input type="radio" name="status" value="SCHEDULED"
                           class="mr-2" style="accent-color: var(--color-primary);"
                           {% if schedule.status == 'SCHEDULED' %}checked{% endif %}>
                    <span class="text-sm text-text-primary">Scheduled</span>
                </label>
                <label class="block">
                    <input type="radio" name="status" value="IN_PROGRESS"
                           class="mr-2" style="accent-color: var(--color-primary);"
                           {% if schedule.status == 'IN_PROGRESS' %}checked{% endif %}>
                    <span class="text-sm text-text-primary">In Progress</span>
                </label>
                <label class="block">
                    <input type="radio" name="status" value="COMPLETED"
                           class="mr-2" style="accent-color: var(--color-primary);"
                           {% if schedule.status == 'COMPLETED' %}checked{% endif %}>
                    <span class="text-sm text-text-primary">Mark complete (pending owner confirmation)</span>
                </label>
                {% endif %}
                {% if can_cancel_status %}
                <label class="block">
                    <input type="radio" name="status" value="CANCELLED"
                           class="mr-2" style="accent-color: var(--color-primary);"
                           {% if schedule.status == 'CANCELLED' %}checked{% endif %}>
                    <span class="text-sm text-text-primary">Cancelled</span>
                </label>
                {% endif %}
            </div>
            
            <div class="mt-4">
                <label for="status_comment" class="block text-sm font-medium mb-1 text-text-primary">
                    Comment (Optional)
                </label>
                <textarea name="comment" id="status_comment" rows="2"
                          class="w-full rounded-lg border px-3 py-2 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary"
                          placeholder="Reason for status change..."></textarea>
            </div>
            
            <div class="flex items-center justify-end gap-3 mt-6">
                <button type="button" onclick="this.closest('.fixed').remove()"
                        class="px-4 py-2 text-sm rounded-lg border transition border-border text-text-secondary">
                    Cancel
                </button>
                <button type="submit"
                        class="px-6 py-2 text-sm font-medium text-white rounded-lg transition flex items-center gap-2 bg-primary">
                    <span class="htmx-indicator">
                        <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                    Update
                </button>
            </div>
        </form>
    </div>
</div>
