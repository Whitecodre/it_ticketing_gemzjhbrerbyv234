{% if assets %}
<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
    {% for asset in assets %}
    <label class="flex items-center gap-2 text-sm text-text-primary cursor-pointer hover:bg-black/5 rounded px-2 py-1 transition">
        <input type="checkbox" name="target_assets" value="{{ asset.pk }}"
               class="rounded border-border text-primary focus:ring-primary flex-shrink-0"
               {% if asset.pk in selected_ids %}checked{% endif %}>
        <span class="truncate">{{ asset.name }} ({{ asset.tracking_id }})</span>
    </label>
    {% endfor %}
</div>
{% else %}
<p class="text-xs text-text-secondary">No trackable assets in the selected department(s) yet.</p>
{% endif %}
