{% load lucide %}
<div id="folderEditModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" data-modal-backdrop onclick="if(event.target===this) this.remove()">
    <div class="dashboard-card w-full max-w-md p-6 shadow-lg" style="max-width: 28rem; margin: 0 auto;">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-semibold" style="color: var(--color-text-primary);">Rename Folder</h3>
            <button type="button" onclick="document.getElementById('folderEditModal').remove()" class="btn-ghost btn-icon">
                {% lucide "x" size=16 %}
            </button>
        </div>
        {% if form.errors %}
        <div class="rounded-lg bg-error/10 p-3 border border-error/30 text-error text-sm mb-3">
            {% for field, errors in form.errors.items %}
                {% for error in errors %}<p>{{ error }}</p>{% endfor %}
            {% endfor %}
        </div>
        {% endif %}
        <form method="post" action="{% url 'documents_display:folder_edit' folder.slug %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium mb-1 text-text-primary">Folder name</label>
                {{ form.name }}
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-text-primary">Description</label>
                {{ form.description }}
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="document.getElementById('folderEditModal').remove()" class="btn-ghost text-sm px-4 py-2 rounded-lg">Cancel</button>
                <button type="submit" class="btn-primary text-sm px-4 py-2 rounded-lg">Save</button>
            </div>
        </form>
    </div>
</div>
