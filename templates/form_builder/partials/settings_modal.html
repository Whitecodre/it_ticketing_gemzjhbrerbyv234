{% load lucide %}

<div class="space-y-4">
    <p class="text-sm text-text-secondary">Update the form details and settings.</p>
    
    <form method="post" action="{% url 'form_builder:settings_save' form_instance.pk %}" 
          hx-post="{% url 'form_builder:settings_save' form_instance.pk %}"
          hx-target="#settingsModalBody"
          hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful) { setTimeout(() => location.reload(), 500); }">
        
        {% csrf_token %}
        
        <div class="form-group">
            <label class="block text-sm font-medium mb-1 text-text-primary">Form Title <span class="text-error">*</span></label>
            <input type="text" name="title" value="{{ form_data.title }}"
                   class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary"
                   placeholder="Enter form title" required>
        </div>
        
        <div class="form-group">
            <label class="block text-sm font-medium mb-1 text-text-primary">Description</label>
            <textarea name="description" rows="2"
                      class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary"
                      placeholder="What is this form for?">{{ form_data.description }}</textarea>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-group">
                <label class="block text-sm font-medium mb-1 text-text-primary">Form Type</label>
                <select name="form_type" class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary">
                    <option value="SERVICE_REQUEST" {% if form_data.form_type == 'SERVICE_REQUEST' %}selected{% endif %}>Service Request</option>
                    <option value="INCIDENT" {% if form_data.form_type == 'INCIDENT' %}selected{% endif %}>Incident</option>
                    <option value="MOBILIZATION" {% if form_data.form_type == 'MOBILIZATION' %}selected{% endif %}>Job Mobilization</option>
                    <option value="RETURN" {% if form_data.form_type == 'RETURN' %}selected{% endif %}>Job Return</option>
                    <option value="SURVEY" {% if form_data.form_type == 'SURVEY' %}selected{% endif %}>Survey</option>
                    <option value="FEEDBACK" {% if form_data.form_type == 'FEEDBACK' %}selected{% endif %}>Feedback</option>
                    <option value="OTHER" {% if form_data.form_type == 'OTHER' %}selected{% endif %}>Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="block text-sm font-medium mb-1 text-text-primary">Status</label>
                <select name="status" class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary">
                    <option value="DRAFT" {% if form_data.status == 'DRAFT' %}selected{% endif %}>Draft</option>
                    <option value="PUBLISHED" {% if form_data.status == 'PUBLISHED' %}selected{% endif %}>Published</option>
                    <option value="ARCHIVED" {% if form_data.status == 'ARCHIVED' %}selected{% endif %}>Archived</option>
                </select>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-group">
                <label class="block text-sm font-medium mb-1 text-text-primary">Theme Color</label>
                <div class="flex items-center gap-2">
                    <input type="color" name="theme_color" value="{{ form_data.theme_color|default:'#0D9488' }}"
                           class="w-12 h-10 rounded border border-border cursor-pointer">
                    <input type="text" name="theme_color_text" value="{{ form_data.theme_color|default:'#0D9488' }}"
                           class="flex-1 rounded-lg border py-2 px-3 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary">
                </div>
            </div>
            
            <div class="form-group flex items-center gap-3 pt-5">
                <label class="flex items-center gap-2 text-sm text-text-primary cursor-pointer">
                    <input type="checkbox" name="logo_enabled" {% if form_data.logo_enabled %}checked{% endif %}>
                    Show company logo on form
                </label>
            </div>
        </div>
        
        <div class="form-group">
            <label class="block text-sm font-medium mb-1 text-text-primary">Confirmation Message</label>
            <textarea name="confirmation_message" rows="2"
                      class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary">{{ form_data.confirmation_message|default:'Thank you! Your submission has been received.' }}</textarea>
        </div>
        
        <div class="form-group">
            <label class="block text-sm font-medium mb-1 text-text-primary">Redirect URL (optional)</label>
            <input type="url" name="redirect_url" value="{{ form_data.redirect_url }}"
                   class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary"
                   placeholder="https://example.com/thank-you">
        </div>
        
        <div class="form-group">
            <label class="flex items-center gap-2 text-sm text-text-primary cursor-pointer">
                <input type="checkbox" name="require_login" {% if form_data.require_login %}checked{% endif %}>
                Require users to be logged in to submit
            </label>
        </div>
        
        <div class="flex justify-end gap-2 pt-4 border-t border-border">
            <button type="button" onclick="closeSettingsModal()" class="btn-ghost text-sm px-4 py-2">Cancel</button>
            <button type="submit" class="btn-primary text-sm px-6 py-2 rounded-lg flex items-center gap-2">
                {% lucide "save" size=16 %} Save Settings
            </button>
        </div>
    </form>
</div>

<script>
    // Sync color picker with text input
    document.addEventListener('DOMContentLoaded', function() {
        const colorInput = document.querySelector('input[type="color"][name="theme_color"]');
        const textInput = document.querySelector('input[name="theme_color_text"]');
        
        if (colorInput && textInput) {
            colorInput.addEventListener('input', function() {
                textInput.value = this.value;
            });
            textInput.addEventListener('input', function() {
                colorInput.value = this.value;
            });
        }
    });
</script>
