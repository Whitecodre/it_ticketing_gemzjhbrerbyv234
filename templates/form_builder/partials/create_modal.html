{% load lucide %}

<div id="createFormContent" class="space-y-4">
    <p class="text-sm text-text-secondary">Fill in the basic information to get started. You'll be able to add fields and customize the form in the builder.</p>
    
    <div class="form-group">
        <label class="block text-sm font-medium mb-1 text-text-primary">Form Title <span class="text-error">*</span></label>
        <input type="text" id="modalFormTitle" 
               class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary"
               placeholder="e.g., Employee Onboarding Form">
    </div>
    
    <div class="form-group">
        <label class="block text-sm font-medium mb-1 text-text-primary">Description</label>
        <textarea id="modalFormDescription" rows="2"
                  class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary"
                  placeholder="What is this form for?"></textarea>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="form-group">
            <label class="block text-sm font-medium mb-1 text-text-primary">Form Type</label>
            <select id="modalFormType" class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary">
                <option value="SERVICE_REQUEST">Service Request</option>
                <option value="INCIDENT">Incident</option>
                <option value="MOBILIZATION">Job Mobilization</option>
                <option value="RETURN">Job Return</option>
                <option value="SURVEY">Survey</option>
                <option value="FEEDBACK">Feedback</option>
                <option value="OTHER" selected>Other</option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="block text-sm font-medium mb-1 text-text-primary">Start from Template</label>
            <select id="modalFormTemplate" class="w-full rounded-lg border py-2.5 px-4 text-sm focus:outline-none focus:ring-2 bg-background border-border text-text-primary ring-primary">
                <option value="BLANK">-- Blank Form --</option>
                {% for template in templates %}
                <option value="{{ template.key }}">{{ template.icon }} {{ template.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    
    <!-- Template Preview -->
    <div id="templatePreview" class="hidden p-3 rounded-lg border bg-background border-border">
        <p class="text-xs text-text-secondary" id="templateDescription">Select a template to see its description.</p>
        <div id="templateFields" class="mt-2 space-y-1"></div>
    </div>
    
    <div class="flex justify-end gap-2 pt-4 border-t border-border">
        <button onclick="window.closeCreateModal()" class="btn-ghost text-sm px-4 py-2">Cancel</button>
        <button onclick="window.createFormFromModal()" class="btn-primary text-sm px-6 py-2 rounded-lg flex items-center gap-2" id="proceedToBuilderBtn">
            {% lucide "arrow-right" size=16 %} Proceed to Builder
        </button>
    </div>
</div>
